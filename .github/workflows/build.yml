name: build-kpm
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: JavSaia/KernelPatch
          ref: 0.13.9-kp-selinux-r2
          path: KernelPatch

      - name: Fetch NDK
        run: |
          curl -sSLo ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          echo "NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r27c" >> $GITHUB_ENV

      - name: Build
        run: make KP_DIR=$GITHUB_WORKSPACE/KernelPatch NDK_HOME=$NDK_HOME

      - uses: actions/upload-artifact@v4
        with:
          name: dsp_bypass-kpm
          path: dsp_bypass.kpm
